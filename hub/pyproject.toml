[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nsa-mcp-hub"
version = "0.1.0"
description = "NSA（Non-standard automation，非标自动化）工具链：把多个 CAD/PLC 自动化内核统一包装成 MCP 服务器（一个共享内核 + 每 kit 一个进程）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
nsa-mcp-hub-nx = "nsa_mcp_hub.servers.nx_mcp:main"
nsa-mcp-hub-gx = "nsa_mcp_hub.servers.gx_mcp:main"
nsa-mcp-hub-acad = "nsa_mcp_hub.servers.acad_mcp:main"
nsa-mcp-hub-sw = "nsa_mcp_hub.servers.sw_mcp:main"
nsa-mcp-hub-codesys = "nsa_mcp_hub.servers.codesys_mcp:main"
nsa-mcp-hub-autoshop = "nsa_mcp_hub.servers.autoshop_mcp:main"
nsa-mcp-hub-acceptance = "nsa_mcp_hub.acceptance.__main__:main"

[tool.setuptools]
packages = ["nsa-mcp-hub", "nsa_mcp_hub.adapters", "nsa_mcp_hub.servers"]

[tool.setuptools.package-data]
nsa-mcp-hub = ["py.typed"]
