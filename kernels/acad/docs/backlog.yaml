# 挖掘全量清单（backlog）：达到"理想效果"一共要挖多少
#
# 和另外两份文档的分工：
#   GAPS.md      当前 8 周内要动的子集（7 条 / 70h），带"现在怎么绕"
#   BACKLOG.md   全量地图（本文件生成）：所有可挖项、工时、门槛、明确不做的
#
# 规则（2026-11-18 与用户约定）：
#   **挖掘类任务先出全量清单，再动手；不要做完一步才建议下一步。**
#   所以这份清单必须在任何一条能力动工之前就存在，且要能回答"总共多少"。
#
# 字段：
#   id       稳定标识（能力将以此命名；已存在的能力不要再列）
#   area     域（对应下面的 areas）
#   title    一句话说清"挖出来能干什么"
#   tier     T1 必做（缺了不能叫能用）/ T2 应该做（专业交付质量）/ T3 可以做（差异化）
#   impact   1–5，对交付的影响
#   hours    预估 agent-hours（±50%，用于排序与预算，不用于承诺）
#   note     关键技术风险 / 为什么这个估法 / 已知卡点
#
# 工时口径与 GAPS.md 一致；两边同 id 的工时**必须相等**（测试会校验）。

schema: 1
updated_at: "2026-11-18"
ideal_state: |
  给定一张零件图/装配图/电气图的需求描述，agent 在真 AutoCAD 2025 上从零做到**可交付**：
  标准图框 + 完整标注 + BOM + 打印样式，出 PDF/DWG 且重开一致；改图后重跑不变形；
  能读别人的图（DXF/DWG 解析）；批量图纸一次出完；全程零静默失败（失败必须给出原因）。
  判定方式：ALPHA_GATE 的 5 条工作流全过 **且** 2D 自动化面覆盖 ≥95%，
  且每个"不能做"都有带证据的说明。

areas:
  - key: annotation
    title: 标注与注释
    have: 22
    why: 机械图的语言；缺一条客户就发现"这图不专业"
  - key: geometry
    title: 几何与编辑
    have: 8
    why: 只会画不会改，等于只能出一次图
  - key: block
    title: 块与外部引用
    have: 3
    why: 真实图纸 80% 的内容是块与外部引用
  - key: layer
    title: 图层与特性
    have: 4
    why: 出图质量与交接规范
  - key: layout
    title: 布局与出图
    have: 3
    why: 交付物就是这几张纸
  - key: solid3d
    title: 三维与实体
    have: 3
    why: 零件校核、干涉、投影出三视图
  - key: data
    title: 数据交换
    have: 3
    why: 与别人的图、BOM、工艺表对接
  - key: domain
    title: 专业领域库
    have: 4
    why: 电气/PLC/标准件——差异化的地方
  - key: engine
    title: 工程化
    have: 0
    why: 不稳、不可重复、没 CI，就等于不能交付
  - key: agent
    title: Agent 接口
    have: 0
    why: 让人/AI 真正能用的那一层

