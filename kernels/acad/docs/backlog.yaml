# 明确不做（写出来是为了防止反复讨论）
not_doing:
  - what: 交互式 UI / 动态输入 / 对象捕捉的交互行为
    why: 本仓库是 headless 自动化，不做人机界面
  - what: 几何约束（GEOMCONSTRAINT / DIMCONSTRAINT / PARAMETRIC）
    why: 完整版 AutoCAD 本身没有，属 Mechanical 专有能力
  - what: 渲染 / 材质 / 动画 / 真实感出图
    why: 与"出工程图"无关
  - what: Sheet Set Manager / 云协作 / 许可证管理
    why: 项目协同范畴，不属于单机出图
  - what: 重写几何内核（复刻 AutoCAD）
    why: 走驱动真机路线；内核由 AutoCAD 提供，这是本仓库的根本取舍
  - what: 光栅图矢量化（Raster→Vector）
