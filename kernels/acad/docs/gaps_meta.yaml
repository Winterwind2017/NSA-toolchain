# 缺口账本的数据源：`tools/gen_gaps.py` 联合 `docs/registry.yaml` 生成 `docs/GAPS.md`
#
# 和 UNSUPPORTED.md 的分工：
#   UNSUPPORTED.md  回答"**为什么用不了**"（卡在哪一层，证据，复核触发条件）
#   GAPS.md         回答"**什么时候轮到它、值多少工时、解锁要什么**"（排序与预算）
#
# 字段：
#   id        与 registry 的 id 同名；kind=planned 时允许是 registry 里还没有的新能力
#   kind      dead（本机拿不到官方路径）| planned（能做但没做）
#   impact    1–5，对交付的影响（5 = 关键路径上卡死；1 = 有替代且无感）
#   hours     预估工时，**agent-hours**（0.5 天 ≈ 4h 的口径见 GAPS.md 头部）；
#             0 表示"不做/不再追"，此时 why 里必须写清为什么不做
#   audience  受影响的受众（mech / elec / general），可多个
#   why       为什么排在这个位次（一句话，讲影响而不是讲技术）
#   unblock   解锁条件（换一条路线 / 补一个资产 / 等外部版本）
#   alt       现在怎么绕过（没有替代就写"无替代"）
#
# 排序规则：impact 降序 → hours 升序 → id 字典序（同 impact 下先做便宜的）。
# 改完跑 `python tools/gen_gaps.py`；tests 会校验它是否过期。

schema: 1
updated_at: "2026-11-18"
note: "工时是按本仓库现有实现速度估的 agent-hours，不是人日；±50% 的误差可接受，用来排序而不是用来承诺。"

items:

  # ── dead：本机拿不到官方路径 ──────────────────────────────────────
  - id: dim.associative
    kind: dead
    impact: 5
    hours: 16
    audience: [mech, general]
    why: 机械图改尺寸后几何要跟着变；非关联标注在改图时是错的，客户一改就露
    unblock: 换路线 —— .NET 插件（NETLOAD）在进程内用 DimensionAssociation
    alt: 保持非关联 + 显式重建（acadkit 现做法，改一次几何要重标一遍）

  - id: block.edit_inplace
    kind: dead
    impact: 4
    hours: 20
    audience: [mech, general]
    why: 图框/标准件都是块，客户要求"就地改一个块、所有引用一起变"
    unblock: 换路线 —— .NET 插件或 ObjectARX 的 BlockEditor
    alt: 重定义块 + 重新插入全部引用（acadkit 现做法，能出结果但丢属性）

  - id: layer.state
    kind: dead
    impact: 3
    hours: 8
    audience: [mech, general]
    why: 出图前切图层状态是标准动作；没有就得手动开关十几个层
    unblock: 换路线 —— .NET 的 LayerStateManager（进程内可用）
    alt: layer.snapshot 属性级快照 → 改 → 恢复（acadkit 现做法）

  - id: solid.revolve
    kind: dead
    impact: 3
    hours: 10
    audience: [mech]
    why: 轴类/盘类零件的回转体是常见需求，只能用拉伸+布尔逼近
    unblock: 换路线 —— .NET 的 Solid3d.CreateRevolvedSolid
    alt: 拉伸 + 布尔逼近（多边形近似，圆弧面不准）

  - id: dim.update
    kind: dead
    impact: 3
    hours: 4
    audience: [mech, general]
    why: 改图时要批量刷新标注；现在只能删了重画
    unblock: 直接实现（重建封装一条命令即可，不需要新 API）
    alt: 删除后按新尺寸重画，或改 TextOverride/Measurement

  - id: interfere
    kind: dead
    impact: 2
    hours: 2
    audience: [mech]
    why: 装配干涉检查是设计校核的常规动作，但布尔求交已经能替代
    unblock: 直接实现（INTERSECT 后看体积 > 0，封装成一条能力）
    alt: 布尔求交看结果体积（acadkit 现做法，已验证）

  - id: view.projection_builtin
    kind: dead
    impact: 2
    hours: 0
    audience: [mech]
    why: 三视图的出图路径；官方 SOLVIEW/SOLDRAW 本机不存在
    unblock: 不再追 —— 已用自建 CSG 投影替代，且投影质量可控
    alt: projection.orthographic（自建 CSG 投影，已 verified）

  - id: constraint.geometric
    kind: dead
    impact: 1
    hours: 0
    audience: [mech, general]
    why: 完整版 AutoCAD 本身就没有几何约束，只有 Mechanical 有；不属于本仓库承诺范围
    unblock: 需要另装 AutoCAD Mechanical（AM 约束），本仓库不做
    alt: 参数化在 Python 侧做"参数驱动重建"（acadkit 现做法）

  # ── planned：能做但没做 ─────────────────────────────────────────
  - id: plot.style
    kind: planned
    impact: 4
    hours: 12
    audience: [mech, elec]
    why: 客户模板几乎都带 CTB/STB；没有打印样式，线宽和颜色全不对
    unblock: 直接实现（PlotConfiguration 可读写，属 COM 可达范围）
    alt: 出图后手工改打印样式，或按图层硬编码线宽

  - id: plot.publish
    kind: planned
    impact: 3
    hours: 8
    audience: [mech, elec]
    why: 一套图十几张，逐张出图再合并很慢；PUBLISH 一次出全套
    unblock: 直接实现（-PUBLISH 会阻塞，需走逐布局出图+合并的既有路径）
    alt: export.pdf_multipage 逐布局出图后合并（已 verified）

  - id: block.dynamic
    kind: planned
    impact: 3
    hours: 24
    audience: [mech, general]
    why: 客户端图纸里的动态块（可见性、拉伸参数）读不全，属性会丢
    unblock: 直接实现（需要解析动态块定义与参数，工作量大于普通块）
    alt: 只读可见性状态的静态几何，参数不可改
