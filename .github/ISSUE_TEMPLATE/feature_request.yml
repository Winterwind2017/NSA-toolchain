name: Feature / capability request
description: 想加一条能力、一个内核，或改进判据
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 新能力（某个软件里某个操作）
        - 新内核（支持另一款软件）
        - 改进判据/验收
        - 文档与上手体验
        - 其它
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 要解决的问题
      description: 你在什么场景下需要它？现在怎么绕过去的？
    validations:
      required: true
  - type: textarea
    id: judge
    attributes:
      label: 怎么算做成（判据）
      description: 能读出什么值来证明成功？失败时应该报什么？
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 你的软件版本与环境
