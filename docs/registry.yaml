# acadkit capability registry（P0 种子）
#
# 来源（全部实测，不推测）：
#   - mcp-patches/ACAD_MECH_CAPABILITY.md      能力矩阵与硬缺口（本机 AutoCAD 2025 / R25.0）
#   - mcp-patches/acad_mech_build.py           机械制图实战层（37 函数）
#   - mcp-patches/acad_ext_mcp.py              扩展层（73 个 TOOLS 键）
#   - autocad-mcp/src/autocad_mcp/             8 个聚合工具 / ~96 子操作 / 3 后端
#   - tools/extract_caps.py                    结构化抽取（docs/_extract.json）
#
# 字段：
#   id        稳定标识（CLI 子命令将以此命名）
#   family    能力族
#   backend   该能力**实测可用**的后端：com | lisp | headless | csg | file
#   status    verified       实测可用，且已有可复现判据
#             usable_unjudged 实测可用，但还没有"几何判据"（P1 要补）
#             pending        有实现未验证 / 参数待定
#             dead           本机无法用官方功能实现（缺口）
#   source    实现出处（文件:函数/键）
#   judge     判据草案（P1 落成代码）；dead 项写替代方案
#   evidence  证据出处
#
# 约定：**status=verified 必须能指出判据**；说不清判据的一律 usable_unjudged。

schema: 1
generated_at: "2026-10-21"
target: "AutoCAD 2025 (R25.0) · 完整版（非 LT）· profile <<VANILLA>>"
sources:
  - "mcp-patches/ACAD_MECH_CAPABILITY.md"
  - "mcp-patches/acad_mech_build.py"
  - "mcp-patches/acad_ext_mcp.py"
  - "autocad-mcp/src/autocad_mcp"

