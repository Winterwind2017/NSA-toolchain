[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acadkit"
version = "0.1.0"
description = "AutoCAD 2025 自动化内核：能力登记 + 四级判据 + 环境自检"
requires-python = ">=3.10"
dependencies = ["pywin32>=306"]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dxf = ["ezdxf>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
acadkit = "acadkit.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]